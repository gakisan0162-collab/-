<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>快適席くじ</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#f5f7fb;color:#222;margin:0}.wrap{max-width:900px;margin:auto;padding:24px 16px 50px}.card{background:white;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 4px 18px #00000012}h1{text-align:center;margin-bottom:4px}.sub{text-align:center;color:#666}.label{font-weight:700;display:block;margin-bottom:8px}input{font-size:20px;padding:12px;border:1px solid #ccc;border-radius:10px;width:100%;box-sizing:border-box}button{border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px}.primary{background:#222;color:white;width:100%}.secondary{background:#eee}.seat{font-size:64px;font-weight:800;text-align:center;padding:18px 0}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.cell{padding:11px 3px;text-align:center;border-radius:9px;background:#eef1f5;font-weight:700}.empty{background:white;border:1px dashed #ccc;color:#aaa}.note{font-size:13px;color:#666;line-height:1.7}.error{color:#b00020}.teacher{margin-top:25px}.danger{background:#fff0f0}.list{width:100%;border-collapse:collapse;margin-top:15px}.list td,.list th{border-bottom:1px solid #eee;padding:8px;text-align:center}.status{text-align:center;color:#666}
</style>
</head>
<body>
<div class="wrap">
<h1>快適席くじ</h1>
<p class="sub">あなたに合いやすい席が、少しだけ当たりやすくなる席替え</p>

<div class="card">
  <label class="label" for="number">自分の出席番号を入力</label>
  <input id="number" type="number" min="1" max="39" placeholder="例：23">
  <button class="primary" onclick="showSeat()">席を確認する</button>
  <div id="result" class="hidden">
    <div class="seat" id="seatResult"></div>
    <p style="text-align:center">あなたの席はこちらです。</p>
  </div>
  <p id="studentError" class="error"></p>
</div>

<div class="card">
  <button class="secondary" onclick="openTeacher()">先生用：全員の席を確認</button>
  <div id="teacher" class="teacher hidden">
    <p class="status" id="updated"></p>
    <div id="grid" class="grid"></div>
    <table class="list"><thead><tr><th>出席番号</th><th>席</th></tr></thead><tbody id="listBody"></tbody></table>
    <button class="secondary danger" onclick="newDraw()">新しい抽選を作る</button>
    <p class="note">※「新しい抽選を作る」を押すと、全員の席が一斉に更新されます。更新後は全員が同じ新しい結果を見ます。</p>
  </div>
</div>
</div>

<script>
let assignment = null;

function loadAssignment(callback){
  google.script.run.withSuccessHandler(data=>{assignment=data.assignment||data; if(callback)callback(data)}).getTeacherData();
}

function showSeat(){
  const n=document.getElementById('number').value.trim();
  const err=document.getElementById('studentError');
  err.textContent='';
  if(!/^([1-9]|[1-3][0-9])$/.test(n)||Number(n)>39){err.textContent='1〜39の出席番号を入力してください。';return;}
  loadAssignment(()=>{
    if(!assignment[n]){err.textContent='その出席番号のデータがありません。';return;}
    document.getElementById('seatResult').textContent=assignment[n].name;
    document.getElementById('result').classList.remove('hidden');
  });
}

function openTeacher(){
  loadAssignment(data=>{renderTeacher(data);document.getElementById('teacher').classList.remove('hidden');});
}

function renderTeacher(data){
  const grid=document.getElementById('grid'); grid.innerHTML='';
  const seatToNum={}; Object.keys(assignment).forEach(n=>seatToNum[assignment[n].name]=n);
  ['A','B','C','D','E','F'].forEach(c=>[1,2,3,4,5,6,7].forEach(r=>{
    const name=c+r, cell=document.createElement('div'); cell.className='cell';
    if(['A1','F1','A7'].includes(name)){cell.className+=' empty';cell.textContent=name+'（空）';}
    else cell.textContent=name+' / '+seatToNum[name]+'番';
    grid.appendChild(cell);
  }));
  const body=document.getElementById('listBody');body.innerHTML='';
  Object.keys(assignment).sort((a,b)=>Number(a)-Number(b)).forEach(n=>{
    const tr=document.createElement('tr');tr.innerHTML=`<td>${n}</td><td>${assignment[n].name}</td>`;body.appendChild(tr);
  });
  document.getElementById('updated').textContent='現在の抽選結果を表示しています。'+(data.updatedAt?' 更新：'+new Date(data.updatedAt).toLocaleString('ja-JP'):'' );
}

function newDraw(){
  if(!confirm('本当に新しい席順を作りますか？全員の席が変更されます。')) return;
  google.script.run.withSuccessHandler(data=>{
    assignment=data; alert('新しい抽選を作りました。');
    openTeacher();
  }).createNewDraw();
}
</script>
</body>
</html>
