<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>快適席くじ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header>
    <h1>快適席くじ</h1>
    <p>教室の温度差を考慮しながら、ランダム性を残して席を決めます。</p>
  </header>

  <section id="studentView" class="card">
    <h2>生徒用</h2>
    <p class="small">先生から共有された抽選リンクを開いて、出席番号を入力してください。</p>
    <label for="numberInput">出席番号</label>
    <div class="inputRow">
      <input id="numberInput" type="number" min="1" max="39" inputmode="numeric" placeholder="例：25">
      <button id="drawBtn">席を見る</button>
    </div>
    <div id="result" class="result hidden"></div>
  </section>

  <section id="teacherView" class="card hidden">
    <div class="teacherHead">
      <div>
        <h2>先生用</h2>
        <p id="roundText" class="small"></p>
      </div>
      <button id="newRoundBtn" class="danger">新しい抽選を作る</button>
    </div>
    <div class="notice">
      新しい抽選を作るとURLの抽選番号が変わります。表示された「共有リンク」を生徒に送ってください。
    </div>
    <div class="shareRow">
      <input id="shareUrl" readonly>
      <button id="copyBtn">共有リンクをコピー</button>
    </div>
    <div class="gridWrap">
      <h3>座席表</h3>
      <p class="small">黒板 ↑　　A＝窓・エアコン側　／　F＝廊下側　　↓ ドア付近</p>
      <div id="seatGrid" class="seatGrid"></div>
    </div>
    <div class="tableWrap">
      <h3>出席番号 → 席</h3>
      <table>
        <thead><tr><th>出席番号</th><th>席</th></tr></thead>
        <tbody id="assignmentTable"></tbody>
      </table>
    </div>
  </section>

  <footer>
    <button id="teacherBtn" class="linkBtn">先生用画面</button>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
